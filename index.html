<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: floorplan:; font-src 'self' data:;">
  <title>FloorplanV2</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/header.css">
  <link rel="stylesheet" href="src/styles/settings.css">
  <link rel="stylesheet" href="src/styles/footer.css">
  <link rel="stylesheet" href="src/styles/Light-buttons.css">
  <link rel="stylesheet" href="src/styles/scene-buttons.css">
  <link rel="stylesheet" href="src/styles/page-buttons.css">
</head>
<body>
  <!-- Header content -->
  <div id="header-bar" class="header-bar-visible">
    <div id="floor-buttons-container"></div>
    <span id="connection-indicator" class="connection-indicator state-disconnected" title="Not connected"></span>
    <button id="open-settings-btn">
      <img src="assets/cog.png" alt="Settings" id="open-settings-btn-img" />
    </button>
  </div>

  <!-- Main body content -->
  <div id="main-body">
    <button id="header-minimise-btn">
      <img src="assets/minimize.png" alt="Minimize" id="header-minimise-btn-img" />
    </button>
    <button id="footer-edit-btn">
      <img src="assets/edit.png" alt="Edit" id="footer-edit-btn-img" />
    </button>
    <div id="floor-panes-container">
      <div class="floor-pane" id="floor-pane-1"></div>
      <div class="floor-pane" id="floor-pane-2" style="display: none;"></div>
      <div class="floor-pane" id="floor-pane-3" style="display: none;"></div>
      <div class="floor-pane" id="floor-pane-4" style="display: none;"></div>
      <div class="floor-pane" id="floor-pane-5" style="display: none;"></div>
      <div class="floor-pane" id="floor-pane-6" style="display: none;"></div>
    </div>
  </div>

  <!-- Footer content -->
  <input type="file" id="image-loader" accept="image/png" style="display: none;" />
  <div id="footer-bar" class="footer-bar-hidden">
    <button class="footer-bar-btn" id="load-image-btn" type="button">Load image</button>
    <button class="footer-bar-btn" id="add-light-btn" type="button">Add Light</button>
    <button class="footer-bar-btn" id="add-scene-btn" type="button">Add Scene Button</button>
    <button class="footer-bar-btn" id="add-page-btn" type="button">Add Page Button</button>
    <button id="lockButton" class="footer-bar-btn" type="button">Unlock</button>
  </div>

  <!-- Settings page -->
  <div id="settings-page" class="hidden">
    <button id="close-settings-btn">
      <img src="assets/close.png" alt="Close" id="close-settings-btn-img" />
    </button>
    <h3>Settings</h3>
    Connection type:
    <select id="connection-type">
      <option value="http" selected>HTTP (default)</option>
      <option value="tcp">TCP (port 26)</option>
    </select>
    IP Address: <input type="text" id="ip-address" />
    Username: <input type="text" id="username" autocomplete="off" />
    Password: <input type="password" id="password" autocomplete="off" />
    <div id="connection-status-text" class="connection-status-text" role="status"></div>
    Number of Floors: 
    <select id="number-of-Floors">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
    <!-- Container for dynamically generated floor name inputs -->
    <div id="floor-names-container"></div>
    <!-- Save button -->
    <button id="save-floor-names-btn">Save Floor Names</button>
    <button id="saveSettingsButton">Save Settings and Connect</button>
  </div>
  
  <!-- Light Edit Menu -->
  <div id="lighteditmenu" class="edit-menu hidden">
    <label for="edit-light-name">Name:</label>
    <input type="text" id="edit-light-name" />
    <label for="edit-light-module">Module:</label>
    <input type="text" id="edit-light-module" />
    <label for="edit-light-device-id">Device ID:</label>
    <input type="text" id="edit-light-device-id" />
    <label for="edit-light-channel">Channel:</label>
    <input type="text" id="edit-light-channel" />
    <button id="save-light-button">Save</button>
  </div>

  <!-- Scene Button Edit Menu -->
  <div id="sceneeditmenu" class="edit-menu hidden">
    <label for="edit-scene-name">Name:</label>
    <input type="text" id="edit-scene-name" />
    <label for="edit-scene-number">Scene number:</label>
    <input type="text" id="edit-scene-number" inputmode="numeric" />
    <div id="edit-scene-error" class="edit-menu-error" role="alert"></div>
    <button id="save-scene-button">Save</button>
  </div>

  <!-- Page Button Edit Menu -->
  <div id="pageeditmenu" class="edit-menu hidden">
    <label for="edit-page-name">Name:</label>
    <input type="text" id="edit-page-name" />
    <label for="edit-page-target">Opens page:</label>
    <select id="edit-page-target"></select>
    <div id="edit-page-error" class="edit-menu-error" role="alert"></div>
    <button id="save-page-button">Save</button>
  </div>

  <script type="module" src="src/Scripts/renderer.js"></script>
</body>
</html>
